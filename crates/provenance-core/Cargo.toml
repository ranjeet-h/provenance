[package]
name = "provenance-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio"] }
tokio = { version = "1.47.1", features = ["rt", "rt-multi-thread", "macros", "sync"] }
provenance-match = { version = "0.1.0", path = "../provenance-match" }
provenance-report = { version = "0.1.0", path = "../provenance-report" }
zip = "8.6.0"
quick-xml = "0.42.0"
pdf-extract = "0.12.0"
lopdf = "0.42"
ed25519-dalek = "3.0.0"

[dev-dependencies]
tempfile = "3.27.0"

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title description">
  <title id="title">Provenance — review the evidence</title>
  <desc id="description">An illustrative review workspace with two synthetic submission passages and their shared text highlighted.</desc>

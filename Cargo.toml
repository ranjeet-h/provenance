[workspace]
members = [
  "crates/provenance-core",
  "crates/provenance-match",
  "crates/provenance-report",
  "apps/app/src-tauri",
]
resolver = "2"

[profile.dev]
# Keep source-line backtraces while avoiding full DWARF symbols in local builds.
debug = "line-tables-only"

[profile.dev.package."*"]
# Native and Rust dependencies can dominate Tauri's debug output size.
debug = false

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

# Opt in only when investigating a debugger issue that needs full symbols:
# cargo build --profile debugging
[profile.debugging]
inherits = "dev"
debug = true

[profile.debugging.package."*"]
debug = true

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
